<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abandoned, Not Forgotten — Off-World Space Archaeology</title>

  <!-- Tailwind CSS via CDN (Zero Build Required) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Editorial & Telemetry Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-obsidian: #090A0F;
      --bg-slate: #1C1F26;
      --mars-rust: #C1440E;
      --telemetry-amber: #E5A93C;
    }

    body {
      background-color: var(--bg-obsidian);
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .font-serif-editorial {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .font-mono-telemetry {
      font-family: 'Space Mono', monospace;
    }

    /* Custom subtle scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(9, 10, 15, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(229, 169, 60, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(229, 169, 60, 0.75);
    }

    /* Floating dust particle animation */
    @keyframes floatDust {
      0%, 100% {
        transform: translate(0px, 0px);
        opacity: 0.25;
      }
      50% {
        transform: translate(14px, -18px);
        opacity: 0.75;
      }
    }

    .dust-particle {
      position: absolute;
      border-radius: 9999px;
      pointer-events: none;
      animation: floatDust linear infinite;
    }

    /* Beacon sonar pulse */
    @keyframes beaconPing {
      0% {
        transform: scale(0.85);
        opacity: 0.85;
      }
      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    .beacon-ring {
      animation: beaconPing 2.6s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    /* Custom Environmental Decay Range Slider */
    input[type="range"].decay-slider {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"].decay-slider::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.16);
    }
    input[type="range"].decay-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      margin-top: -6px;
      background-color: #E5A93C;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(229, 169, 60, 0.95);
      border: 2px solid #090A0F;
      transition: transform 0.15s ease;
    }
    input[type="range"].decay-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Smooth Slide-over Drawer */
    .drawer-panel {
      transform: translateX(100%);
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .drawer-panel.open {
      transform: translateX(0);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#E5A93C] selection:text-[#090A0F]">

    <div class="flex items-center p-1 rounded-full bg-[#1C1F26]/90 backdrop-blur-md border border-white/15 shadow-2xl">

        id="btn-moon"
        onclick="switchWorld('moon')"
        class="px-5 py-2 rounded-full font-mono-telemetry text-xs tracking-widest transition-all duration-300 flex items-center gap-2 cursor-pointer bg-[#E5A93C] text-[#090A0F] font-bold shadow-[0_0_20px_rgba(229,169,60,0.45)]"
      >
        <span>◐</span>
        <span>THE MOON</span>
      </button>

      <button
        id="btn-mars"

      >
        <span>◉</span>
        <span>MARS</span>
      </button>
    </div>

    <!-- Web Audio API Deep Space Drone Toggle -->
    <div>
      <button

        <span id="audio-icon">🔇</span>
        <span id="audio-label">DEEP SPACE AUDIO</span>

    </div>
  </header>

    ></div>

    <div class="relative w-full max-w-6xl aspect-[16/9] min-h-[340px] max-h-[72vh]">
      <!-- SVG Topographical Contours -->

    // ------------------------------------------------------------------------
    // 2. APPLICATION STATE & LOCALSTORAGE PERSISTENCE
    // ------------------------------------------------------------------------
    let currentWorld = 'moon';
    let selectedArtifactId = null;
    let currentDecayIndex = 0;

    const STORAGE_KEY = 'abandoned_not_forgotten_html_v1';
    let tributesStore = {};

    function loadTributes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          tributesStore = JSON.parse(raw);
          return;
        }
      } catch (e) {
        console.warn('localStorage unavailable:', e);
      }
      ARTIFACTS.forEach((a) => {
        tributesStore[a.id] = [...a.defaultTributes];
      });
    }

    function saveTributes() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tributesStore));
      } catch (e) {
        console.warn('Could not save tributes:', e);
      }
    }

    function calculateDaysAlone(endDateIso) {
      const end = new Date(endDateIso).getTime();
      const now = Date.now();
      const diff = Math.max(0, Math.floor((now - end) / (1000 * 60 * 60 * 24)));
      return diff.toLocaleString();
    }

      for (let i = 0; i < 28; i++) {
        const dot = document.createElement('div');
        dot.className = 'dust-particle';
        const size = (i % 3) + 1.5;
        dot.style.width = `${size}px`;
        dot.style.height = `${size}px`;
        dot.style.left = `${(i * 37) % 100}%`;
        dot.style.top = `${(i * 53) % 100}%`;
        dot.style.animationDuration = `${12 + (i % 10)}s`;
        dot.style.animationDelay = `-${i * 1.1}s`;
        dot.style.backgroundColor = isMars ? '#E87A48' : '#CBD5E1';
        dot.style.boxShadow = isMars
          ? '0 0 8px rgba(193, 68, 14, 0.65)'
          : '0 0 6px rgba(226, 232, 240, 0.45)';
        container.appendChild(dot);
      }
    }

    function openArtifact(id) {
      const artifact = ARTIFACTS.find((a) => a.id === id);
      if (!artifact) return;

      selectedArtifactId = id;
      currentDecayIndex = 0;
      renderBeaconsAndFooter();

      document.getElementById('drawer-mission').textContent = artifact.mission;
      renderDrawerBody(artifact);

      const backdrop = document.getElementById('drawer-backdrop');
      const drawer = document.getElementById('story-drawer');
      backdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        backdrop.classList.remove('opacity-0');
        drawer.classList.add('open');
      });
    }

    function closeDrawer() {
      selectedArtifactId = null;
      renderBeaconsAndFooter();

      const backdrop = document.getElementById('drawer-backdrop');
      const drawer = document.getElementById('story-drawer');
      drawer.classList.remove('open');
      backdrop.classList.add('opacity-0');
      setTimeout(() => {
        backdrop.classList.add('hidden');
      }, 320);
    }

    function updateDecayStage(idx) {
      currentDecayIndex = Number(idx);
      const artifact = ARTIFACTS.find((a) => a.id === selectedArtifactId);
      if (!artifact) return;

      const stage = artifact.decayStages[currentDecayIndex];
      document.getElementById('decay-integrity').textContent = `${stage.integrity}%`;
      document.getElementById('decay-epoch').textContent = `EPOCH 0${currentDecayIndex + 1} / 04`;
      document.getElementById('decay-label').textContent = stage.label;
      document.getElementById('decay-condition').textContent = stage.condition;

      const schematicEl = document.getElementById('decay-schematic');
      schematicEl.style.filter = stage.filter;
      schematicEl.style.opacity = Math.max(0.38, stage.integrity / 100);

      const dustEl = document.getElementById('decay-dust-grain');
      dustEl.style.opacity = (100 - stage.integrity) / 140;
    }

    function submitTribute(event) {
      event.preventDefault();
      const artifact = ARTIFACTS.find((a) => a.id === selectedArtifactId);
      if (!artifact) return;

      const nameInput = document.getElementById('tribute-sender');
      const msgInput = document.getElementById('tribute-message');
      const msg = msgInput.value.trim();
      if (!msg) return;

      const newEntry = {
        sender: (nameInput.value.trim() || 'ANONYMOUS LISTENER').toUpperCase(),
        message: msg,
        timestamp: new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC',
        isNew: true
      };

      if (!tributesStore[artifact.id]) tributesStore[artifact.id] = [];
      tributesStore[artifact.id].unshift(newEntry);
      saveTributes();

      msgInput.value = '';
      renderDrawerBody(artifact, true);
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    function renderDrawerBody(artifact, showPingSuccess = false) {
      const daysAlone = calculateDaysAlone(artifact.endDate);
      const stage = artifact.decayStages[currentDecayIndex];
      const tributes = tributesStore[artifact.id] || [];

      const finalQuoteHTML = artifact.finalTransmission

              FINAL DOWNLINK PACKET // DECODED
            </div>
            <p class="font-serif-editorial italic text-base sm:text-lg text-white">
              ${artifact.finalTransmission}
            </p>
          </div>
        `
        : '';

      const narrativeHTML = artifact.narrative
        .map(
          (para) => `
          <p class="font-serif-editorial text-[16px] sm:text-[17px] leading-[1.78] text-slate-200/95 first-letter:text-3xl first-letter:font-bold first-letter:text-[#E5A93C] first-letter:mr-1">
            ${para}
          </p>
        `
        )
        .join('');

      const tributesListHTML = tributes
        .map(
          (t) => `
          <div class="p-3 rounded-lg border text-xs ${
            t.isNew
              ? 'bg-[#E5A93C]/10 border-[#E5A93C]/50 shadow-[0_0_20px_rgba(229,169,60,0.12)]'
              : 'bg-[#090A0F]/60 border-white/10'
          }">
            <div class="flex items-center justify-between text-[10px] font-mono-telemetry mb-1">
              <span class="text-[#E5A93C] font-bold flex items-center gap-1.5">
                ${t.isNew ? '<span class="w-1.5 h-1.5 rounded-full bg-[#E5A93C] animate-ping"></span>' : ''}
                ${escapeHTML(t.sender)}
              </span>
              <span class="text-slate-500">${escapeHTML(t.timestamp)}</span>
            </div>
            <p class="text-slate-200 leading-relaxed font-serif-editorial italic text-sm">
              “${escapeHTML(t.message)}”
            </p>
          </div>
        `
        )
        .join('');

      document.getElementById('drawer-content').innerHTML = `
        <!-- Title & Status -->
        <div>
          <div class="flex flex-wrap items-center gap-2.5 mb-3">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded text-[10px] font-mono-telemetry tracking-wider border ${artifact.statusBadgeClass}">
              ⚠ ${artifact.status}
            </span>
            <span class="px-2.5 py-1 rounded text-[10px] font-mono-telemetry tracking-wider bg-white/5 border border-white/10 text-slate-300">
              EPOCH ${artifact.year}
            </span>
          </div>
          <h2 class="font-serif-editorial text-2xl sm:text-3xl font-bold text-white leading-tight">
            ${artifact.name}
          </h2>
        </div>

        <!-- Telemetry Cards -->
        <div class="grid grid-cols-2 gap-3">
          <div class="p-3.5 rounded-xl bg-white/[0.03] border border-white/10">
            <div class="text-[10px] font-mono-telemetry text-slate-400 mb-1">◷ DAYS ALONE</div>
            <div class="font-mono-telemetry text-xl sm:text-2xl font-bold text-[#E5A93C]">${daysAlone}</div>
            <div class="text-[10px] font-mono-telemetry text-slate-500 mt-0.5">LIVE COUNTER TO TODAY</div>
          </div>

          <div class="p-3.5 rounded-xl bg-white/[0.03] border border-white/10">
            <div class="text-[10px] font-mono-telemetry text-slate-400 mb-1">⌖ SURFACE COORDINATES</div>
            <div class="font-mono-telemetry text-xs sm:text-sm font-semibold text-slate-100 leading-snug">${artifact.coordinates}</div>
            <div class="text-[10px] font-mono-telemetry text-slate-500 mt-1">${artifact.elevation}</div>
          </div>
        </div>

        ${finalQuoteHTML}

        <!-- First-Person Story -->
        <div class="space-y-4">
          <div class="text-[11px] font-mono-telemetry tracking-widest text-slate-400">
            📡 FIRST-PERSON ARCHIVAL VOICE
          </div>
          ${narrativeHTML}
        </div>

        <!-- Environmental Decay Timeline -->
        <div class="rounded-xl bg-[#090A0F]/80 border border-white/10 p-4 sm:p-5">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-mono-telemetry tracking-wider text-[#E5A93C]">
              ⚙ ENVIRONMENTAL DECAY TIMELINE
            </span>
            <span class="text-[11px] font-mono-telemetry text-slate-400">
              INTEGRITY: <strong id="decay-integrity" class="text-white">${stage.integrity}%</strong>
            </span>
          </div>

          <div class="relative h-32 rounded-lg bg-gradient-to-b from-white/[0.03] to-transparent border border-white/5 flex items-center justify-center overflow-hidden mb-4">
            <div
              id="decay-schematic"
              class="transition-all duration-500 flex flex-col items-center"
              style="filter: ${stage.filter}; opacity: ${Math.max(0.38, stage.integrity / 100)};"
            >
              ${getArtifactSchematicSVG(artifact.id)}
            </div>

            <div
              id="decay-dust-grain"
              class="absolute inset-0 pointer-events-none transition-opacity duration-500"
              style="opacity: ${(100 - stage.integrity) / 140}; background-image: radial-gradient(rgba(229,169,60,0.3) 1px, transparent 0); background-size: 10px 10px;"
            ></div>

            <div class="absolute bottom-2 left-3 right-3 flex items-center justify-between text-[10px] font-mono-telemetry text-slate-400">
              <span id="decay-epoch">EPOCH 0${currentDecayIndex + 1} / 04</span>
              <span id="decay-label" class="text-[#E5A93C]">${stage.label}</span>
            </div>
          </div>

          <input
            type="range"
            min="0"
            max="${artifact.decayStages.length - 1}"
            step="1"
            value="${currentDecayIndex}"
            oninput="updateDecayStage(this.value)"
            class="w-full decay-slider"
          />

          <div class="flex justify-between mt-1.5 text-[10px] font-mono-telemetry text-slate-500">
            ${artifact.decayStages
              .map((s) => `<span>${s.label.split('//')[0].trim()}</span>`)
              .join('')}
          </div>

          <p id="decay-condition" class="mt-3 text-xs leading-relaxed text-slate-300 border-t border-white/10 pt-3">
            ${stage.condition}
          </p>
        </div>

        <!-- Send a Signal / Leave a Tribute -->
        <div class="rounded-xl bg-white/[0.03] border border-white/10 p-4 sm:p-5 space-y-4">
          <div class="flex items-center justify-between">
            <span class="text-xs font-mono-telemetry tracking-wider text-[#E5A93C]">
              ✉ SEND A SIGNAL // LEAVE A TRIBUTE
            </span>
            ${
              showPingSuccess
                ? '<span class="text-[10px] font-mono-telemetry text-emerald-400">✓ UPLINK TRANSMITTED</span>'
                : ''
            }
          </div>

          <form onsubmit="submitTribute(event)" class="space-y-2.5">
            <input
              id="tribute-sender"
              type="text"
              maxlength="42"
              placeholder="Your Name / Callsign (Optional)"
              class="w-full px-3.5 py-2 rounded-lg bg-[#090A0F]/90 border border-white/10 text-xs font-mono-telemetry text-white placeholder-slate-500 focus:outline-none focus:border-[#E5A93C]"
            />
            <div class="flex gap-2">
              <input
                id="tribute-message"
                type="text"
                maxlength="180"
                required
                placeholder="Transmit a message across space to ${artifact.shortName}..."
                class="flex-1 px-3.5 py-2.5 rounded-lg bg-[#090A0F]/90 border border-white/10 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-[#E5A93C]"
              />
              <button
                type="submit"
                class="px-4 py-2.5 rounded-lg bg-[#E5A93C] text-[#090A0F] font-mono-telemetry text-xs font-bold tracking-wider hover:bg-[#f0b951] transition-all cursor-pointer shadow-[0_0_20px_rgba(229,169,60,0.3)]"
              >
                PING ↗
              </button>
            </div>
          </form>

          <div class="pt-3 border-t border-white/10">
            <div class="flex items-center justify-between text-[10px] font-mono-telemetry text-slate-400 mb-3">
              <span>TRANSMISSIONS RECEIVED FROM EARTH (${tributes.length})</span>
              <span>DSN-ARCHIVE</span>
            </div>
            <div class="space-y-2.5 max-h-52 overflow-y-auto pr-1">
              ${tributesListHTML}
            </div>
          </div>
        </div>
      `;
    }

    // ------------------------------------------------------------------------
    // 7. WEB AUDIO API: AMBIENT DEEP SPACE DRONE & RADIO STATIC SYNTHESIZER
    // ------------------------------------------------------------------------
    let audioCtx = null;
    let masterGain = null;
    let staticTimer = null;
    let isAudioPlaying = false;

    function toggleSpaceAudio() {
      const btn = document.getElementById('btn-audio');
      const icon = document.getElementById('audio-icon');
      const label = document.getElementById('audio-label');

      if (isAudioPlaying) {
        if (staticTimer) clearTimeout(staticTimer);
        if (audioCtx && masterGain) {
          masterGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
          setTimeout(() => {
            if (audioCtx) audioCtx.close();
            audioCtx = null;
          }, 550);
        }
        isAudioPlaying = false;
        icon.textContent = '🔇';
        label.textContent = 'DEEP SPACE AUDIO';
        btn.className =
          'px-3.5 py-2 rounded-full border font-mono-telemetry text-[11px] tracking-wider flex items-center gap-2 transition-all cursor-pointer bg-[#1C1F26]/80 border-white/15 text-slate-400 hover:text-white hover:border-white/30';
        return;
      }

      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();

        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        masterGain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 2.2);
        masterGain.connect(audioCtx.destination);

        // Cosmic sub-bass drone
        const osc1 = audioCtx.createOscillator();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(55, audioCtx.currentTime);

        const osc2 = audioCtx.createOscillator();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(82.41, audioCtx.currentTime);

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(160, audioCtx.currentTime);

        const osc2Gain = audioCtx.createGain();
        osc2Gain.gain.setValueAtTime(0.32, audioCtx.currentTime);

        osc1.connect(filter);
        osc2.connect(osc2Gain);
        osc2Gain.connect(filter);
        filter.connect(masterGain);

        osc1.start();
        osc2.start();

        // Occasional faint radio static & telemetry ping
        const scheduleRadioStatic = () => {
          if (!audioCtx || audioCtx.state !== 'running') return;
          const now = audioCtx.currentTime;
          const bufferSize = audioCtx.sampleRate * 1.2;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;

          const bandpass = audioCtx.createBiquadFilter();
          bandpass.type = 'bandpass';
          bandpass.frequency.setValueAtTime(1500 + Math.random() * 800, now);
          bandpass.Q.setValueAtTime(4.5, now);

          const nGain = audioCtx.createGain();
          nGain.gain.setValueAtTime(0.0001, now);
          nGain.gain.exponentialRampToValueAtTime(0.032, now + 0.35);
          nGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.15);

          noise.connect(bandpass);
          bandpass.connect(nGain);
          nGain.connect(masterGain);
          noise.start(now);

          staticTimer = setTimeout(scheduleRadioStatic, 6000 + Math.random() * 6000);
        };

        staticTimer = setTimeout(scheduleRadioStatic, 2500);

        isAudioPlaying = true;
        icon.textContent = '🔊';
        label.textContent = 'TELEMETRY AUDIO: ON';
        btn.className =
          'px-3.5 py-2 rounded-full border font-mono-telemetry text-[11px] tracking-wider flex items-center gap-2 transition-all cursor-pointer bg-[#E5A93C]/15 border-[#E5A93C] text-[#E5A93C] shadow-[0_0_20px_rgba(229,169,60,0.2)]';
      } catch (err) {
        console.error('Audio start failed:', err);
      }
    }

    // Close drawer with Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && selectedArtifactId) closeDrawer();
    });

    // ------------------------------------------------------------------------
    // 8. INITIALIZE APPLICATION ON PAGE LOAD
    // ------------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      loadTributes();
      renderDustParticles();
      renderTopographicalMap();
      renderBeaconsAndFooter();
    });
  </script>
</body>
</html>
